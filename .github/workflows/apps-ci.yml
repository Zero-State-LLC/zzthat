name: Apps CI

# App tests for the zzThat iOS and Android apps (runtime.md, Testing; tasks.md
# T004). Triggers and runners follow the ZQ27 no-spend default until Danny
# answers ZQ27:
#   checks   ubuntu-latest, every pull request: pin, strings, manifests.
#   android  ubuntu-latest, every pull request: client generation, JVM unit
#            tests, Paparazzi, then the ML Kit test on an emulator.
#   ios      macos-26, only on workflow_dispatch or with the ios-ci label.
# The labeled type is what lets adding ios-ci start the ios job. Adding any
# label also reruns the other jobs. A skipped ios job does not fail a check.
# Not a required check. The required check is ci.yml (build).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The one instrumented test the android job runs (runtime.md, Testing).
  ZZ_ANDROID_READ_TEST: com.zer0state.zzthat.read.ReadPipelineInstrumentedTest
  # runtime.md, Testing: app tests and snapshots run on this destination.
  ZZ_IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  ZZ_XCODE: /Applications/Xcode_26.6.app
  ZZ_XCODEGEN_VERSION: 2.46.0

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin check (SC-10)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pin="$(tr -d '[:space:]' < contracts/ZZTHIS-API-PIN)"
          sh scripts/sync-zzthis.sh "$pin"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            git --no-pager diff --stat
            echo "The tree differs from zzThis at ${pin}. Run scripts/sync-zzthis.sh ${pin} and commit what it changes." >&2
            exit 1
          fi
      - name: String check (T082)
        if: ${{ !cancelled() }}
        run: python3 scripts/check-strings.py
      - name: Manifest check (T075)
        if: ${{ !cancelled() }}
        run: python3 scripts/check-manifests.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the Kotlin client (T015)
        run: ./gradlew :core-api:openApiGenerate
      - name: Compile the generated client
        run: ./gradlew :core-api:compileKotlin
      - name: JVM unit tests (plain Kotlin modules)
        run: ./gradlew :core-grammar:test :core-api:test
      # The Android modules (app, core-auth, core-design, core-storage) are not
      # written yet and are left out of settings.gradle.kts. Every step below
      # runs only once app/build.gradle.kts exists, so the job does not fail on
      # modules that are not there; it is not a claim that Android is done.
      - name: Android unit tests
        if: ${{ hashFiles('apps/android/app/build.gradle.kts') != '' }}
        run: >-
          ./gradlew
          :core-auth:testDebugUnitTest
          :core-storage:testDebugUnitTest
          :core-design:testDebugUnitTest
          :app:testDemoDebugUnitTest
          :app:testLocalDebugUnitTest
          :app:testProdDebugUnitTest
      - name: Paparazzi snapshots (demo flavor)
        if: ${{ hashFiles('apps/android/app/build.gradle.kts') != '' }}
        run: ./gradlew :app:verifyPaparazziDemoDebug
      - name: Upload Paparazzi differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failures
          path: apps/android/app/build/paparazzi/failures
          if-no-files-found: ignore
      - name: Enable KVM
        if: ${{ hashFiles('apps/android/app/build.gradle.kts') != '' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ML Kit read pipeline test on an emulator
        if: ${{ hashFiles('apps/android/app/build.gradle.kts') != '' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The image's default 6 GB userdata partition needs 7.37 GB free, and
          # the runner has about 6.8 GB here, so the emulator quit at launch
          # ("Not enough space to create userdata partition", run 37380570500).
          # A 4 GB partition needs 4.9 GB.
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/android
          script: ./gradlew :app:connectedDemoDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=${{ env.ZZ_ANDROID_READ_TEST }}

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ios-ci') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s "$ZZ_XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | grep 'iPhone 17' || true
      - name: Install XcodeGen
        run: |
          curl --proto =https -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${ZZ_XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: |
          xcodegen --version
          xcodegen generate
      - name: ZZCore tests (vectors, bands, Vision read pipeline)
        run: swift test --package-path apps/ios/Packages/ZZCore
      - name: ZZAPI tests (stub transport fixtures)
        run: swift test --package-path apps/ios/Packages/ZZAPI
      - name: App tests and snapshots (Demo)
        run: >-
          xcodebuild test
          -project apps/ios/zzThat.xcodeproj
          -scheme zzThat
          -configuration Demo
          -destination "$ZZ_IOS_DESTINATION"
          -only-testing:zzThatTests
          -skipPackagePluginValidation
          -resultBundlePath "$RUNNER_TEMP/zzThatTests.xcresult"
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/zzThatTests.xcresult
          if-no-files-found: ignore

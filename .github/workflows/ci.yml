name: CI

# Spec lint and the pinned OpenAPI check. App tests run in
# .github/workflows/apps-ci.yml.
# The job id stays `build`, matching the zzThis required check name.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint specs
        run: python3 scripts/lint-specs.py
      - name: Check the OpenAPI copy against the zzThis pin
        run: |
          pin="$(tr -d '[:space:]' < contracts/ZZTHIS-API-PIN)"
          curl -fsSL "https://raw.githubusercontent.com/Zero-State-LLC/zzthis/${pin}/specs/005-v1-api/openapi.yaml" -o "$RUNNER_TEMP/openapi.yaml"
          diff -u "$RUNNER_TEMP/openapi.yaml" contracts/zzthis-v1.openapi.yaml

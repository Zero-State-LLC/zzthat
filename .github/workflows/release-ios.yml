name: Release iOS

# The signed iOS .ipa for App Store Connect (tasks.md T107, zzThis #183 row
# 6). Run by hand only. The job waits on the app-store-release environment,
# whose required reviewer Danny sets, and it uploads nothing to App Store
# Connect: the .ipa and the dSYMs are workflow artifacts, and Danny uploads
# the .ipa himself (Transporter or Xcode) and submits. No altool, notarytool,
# or Transporter call is made here, and the export destination is "export".
#
# Danny sets these on the app-store-release environment. Nothing is committed.
#   Secrets:   ZZ_IOS_DIST_CERT_P12_BASE64 (the Apple Distribution
#              certificate and its private key, as a .p12, base64),
#              ZZ_IOS_DIST_CERT_PASSWORD (the .p12 password),
#              ZZ_IOS_PROFILE_BASE64 (the App Store provisioning profile
#              for com.zer0state.zzthat, base64)
#   Variables: ZZ_API_ORIGIN, ZZ_GOOGLE_IOS_CLIENT_ID,
#              ZZ_GOOGLE_REVERSED_CLIENT_ID, ZZ_PRIVACY_URL,
#              ZZ_SUPPORT_EMAIL, and ZZ_IOS_TEAM_ID (the 10-character
#              Apple team id)
# The temporary keychain's password is generated per run, not stored.
#
# Signing settings apply to the zzThat target only. They are passed through
# a generated XcodeGen spec that includes project.yml, because a provisioning
# profile on the xcodebuild command line also reaches the Swift package
# targets, which reject it ("does not support provisioning profiles").

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  # Keep these the same as the ios job in apps-ci.yml.
  ZZ_XCODE: /Applications/Xcode_26.6.app
  ZZ_XCODEGEN_VERSION: 2.46.0
  ZZ_BUNDLE_ID: com.zer0state.zzthat

jobs:
  release-ios:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store-release
    env:
      ZZ_API_ORIGIN: ${{ vars.ZZ_API_ORIGIN }}
      ZZ_GOOGLE_IOS_CLIENT_ID: ${{ vars.ZZ_GOOGLE_IOS_CLIENT_ID }}
      ZZ_GOOGLE_REVERSED_CLIENT_ID: ${{ vars.ZZ_GOOGLE_REVERSED_CLIENT_ID }}
      ZZ_PRIVACY_URL: ${{ vars.ZZ_PRIVACY_URL }}
      ZZ_SUPPORT_EMAIL: ${{ vars.ZZ_SUPPORT_EMAIL }}
      ZZ_IOS_TEAM_ID: ${{ vars.ZZ_IOS_TEAM_ID }}
      ZZ_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the work paths
        # The runner context is not available in job-level env.
        run: |
          {
            echo "ZZ_KEYCHAIN=$RUNNER_TEMP/zzthat-release.keychain-db"
            echo "ZZ_ARCHIVE=$RUNNER_TEMP/zzThat.xcarchive"
            echo "ZZ_EXPORT=$RUNNER_TEMP/export"
          } >> "$GITHUB_ENV"
      - name: Check the release settings
        env:
          CERT_SET: ${{ secrets.ZZ_IOS_DIST_CERT_P12_BASE64 != '' }}
          CERT_PASSWORD_SET: ${{ secrets.ZZ_IOS_DIST_CERT_PASSWORD != '' }}
          PROFILE_SET: ${{ secrets.ZZ_IOS_PROFILE_BASE64 != '' }}
        run: |
          missing=""
          for name in ZZ_API_ORIGIN ZZ_GOOGLE_IOS_CLIENT_ID ZZ_GOOGLE_REVERSED_CLIENT_ID ZZ_PRIVACY_URL ZZ_SUPPORT_EMAIL ZZ_IOS_TEAM_ID; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          [ "$CERT_SET" = true ] || missing="$missing ZZ_IOS_DIST_CERT_P12_BASE64"
          [ "$CERT_PASSWORD_SET" = true ] || missing="$missing ZZ_IOS_DIST_CERT_PASSWORD"
          [ "$PROFILE_SET" = true ] || missing="$missing ZZ_IOS_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "Set these on the app-store-release environment:$missing" >&2
            exit 1
          fi
          case "$ZZ_API_ORIGIN" in
            https://*) ;;
            *) echo "ZZ_API_ORIGIN must be an https origin." >&2; exit 1 ;;
          esac
          if ! printf '%s' "$ZZ_IOS_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "ZZ_IOS_TEAM_ID must be the 10-character Apple team id." >&2
            exit 1
          fi
          # GoogleSignIn raises an exception when the URL scheme is not the
          # reversed client id (runtime.md, iOS Google setup).
          if [ "$ZZ_GOOGLE_IOS_CLIENT_ID" != unset ]; then
            want="com.googleusercontent.apps.${ZZ_GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
            if [ "$ZZ_GOOGLE_REVERSED_CLIENT_ID" != "$want" ]; then
              echo "ZZ_GOOGLE_REVERSED_CLIENT_ID must be $want, the reversed ZZ_GOOGLE_IOS_CLIENT_ID." >&2
              exit 1
            fi
          fi
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s "$ZZ_XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: |
          curl --proto =https -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${ZZ_XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Test the verify script
        run: python3 -m unittest discover -s scripts -p "test_verify_ipa.py" -v
      - name: Install the distribution certificate and the profile
        env:
          ZZ_IOS_DIST_CERT_P12_BASE64: ${{ secrets.ZZ_IOS_DIST_CERT_P12_BASE64 }}
          ZZ_IOS_DIST_CERT_PASSWORD: ${{ secrets.ZZ_IOS_DIST_CERT_PASSWORD }}
          ZZ_IOS_PROFILE_BASE64: ${{ secrets.ZZ_IOS_PROFILE_BASE64 }}
        run: |
          set -eu
          umask 077
          printf '%s' "$ZZ_IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$ZZ_IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/zzthat.mobileprovision"

          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$ZZ_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$ZZ_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$ZZ_KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$ZZ_KEYCHAIN" -f pkcs12 \
            -P "$ZZ_IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$ZZ_KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$ZZ_KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v -p codesigning "$ZZ_KEYCHAIN" | grep -E '^ *[0-9]+\) ' || true)"
          if [ "$(printf '%s\n' "$identities" | grep -c .)" -ne 1 ]; then
            printf '%s\n' "$identities" >&2
            echo "The .p12 must hold exactly one valid signing identity. A valid one needs the Apple WWDR intermediate certificate, which the runner image installs." >&2
            exit 1
          fi
          identity="$(printf '%s\n' "$identities" | sed 's/^[^"]*"\(.*\)".*$/\1/')"
          case "$identity" in
            "Apple Distribution: "*"($ZZ_IOS_TEAM_ID)" | "iPhone Distribution: "*"($ZZ_IOS_TEAM_ID)") ;;
            *) echo "The certificate is $identity, not a distribution certificate of team $ZZ_IOS_TEAM_ID." >&2; exit 1 ;;
          esac

          security cms -D -i "$RUNNER_TEMP/zzthat.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")"
          profile_team="$(plutil -extract TeamIdentifier.0 raw -o - "$RUNNER_TEMP/profile.plist")"
          app_id="$(plutil -extract Entitlements.application-identifier raw -o - "$RUNNER_TEMP/profile.plist")"
          if [ "$profile_team" != "$ZZ_IOS_TEAM_ID" ] || [ "$app_id" != "$ZZ_IOS_TEAM_ID.$ZZ_BUNDLE_ID" ]; then
            echo "The profile is for $app_id of team $profile_team, not $ZZ_IOS_TEAM_ID.$ZZ_BUNDLE_ID." >&2
            exit 1
          fi
          if plutil -extract ProvisionedDevices xml1 -o /dev/null "$RUNNER_TEMP/profile.plist" 2>/dev/null; then
            echo "The profile lists devices. Use an App Store distribution profile." >&2
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/zzthat.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          {
            echo "ZZ_SIGN_IDENTITY=$identity"
            echo "ZZ_PROFILE_UUID=$uuid"
          } >> "$GITHUB_ENV"
          echo "Signing as $identity with profile $uuid."
      - name: Generate the Xcode project with Release signing on the app target
        working-directory: apps/ios
        run: |
          set -eu
          # Not committed: the spec is written here, so project.yml's relative
          # paths resolve, and removed in the cleanup step.
          cat > zzThat-release-signing.yml <<EOF
          include:
            - project.yml
          targets:
            zzThat:
              settings:
                configs:
                  Release:
                    CODE_SIGN_STYLE: Manual
                    DEVELOPMENT_TEAM: "$ZZ_IOS_TEAM_ID"
                    CODE_SIGN_IDENTITY: "$ZZ_SIGN_IDENTITY"
                    PROVISIONING_PROFILE_SPECIFIER: "$ZZ_PROFILE_UUID"
                    OTHER_CODE_SIGN_FLAGS: "--keychain $ZZ_KEYCHAIN"
          EOF
          xcodegen --version
          xcodegen generate --spec zzThat-release-signing.yml
          test -d zzThat.xcodeproj
      - name: Archive the Release build
        run: |
          set -eu
          version="$(tr -d '[:space:]' < apps/VERSION)"
          xcodebuild archive \
            -project apps/ios/zzThat.xcodeproj \
            -scheme zzThat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ZZ_ARCHIVE" \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION="$ZZ_BUILD_NUMBER" \
            MARKETING_VERSION="$version" \
            ZZ_API_ORIGIN="$ZZ_API_ORIGIN" \
            ZZ_GOOGLE_IOS_CLIENT_ID="$ZZ_GOOGLE_IOS_CLIENT_ID" \
            ZZ_GOOGLE_REVERSED_CLIENT_ID="$ZZ_GOOGLE_REVERSED_CLIENT_ID" \
            ZZ_PRIVACY_URL="$ZZ_PRIVACY_URL" \
            ZZ_SUPPORT_EMAIL="$ZZ_SUPPORT_EMAIL"
      - name: Export the .ipa (destination export, no upload)
        run: |
          set -eu
          options="$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$options"
          buddy=/usr/libexec/PlistBuddy
          "$buddy" -c "Add :method string app-store-connect" "$options"
          "$buddy" -c "Add :destination string export" "$options"
          "$buddy" -c "Add :signingStyle string manual" "$options"
          "$buddy" -c "Add :teamID string $ZZ_IOS_TEAM_ID" "$options"
          "$buddy" -c "Add :signingCertificate string $ZZ_SIGN_IDENTITY" "$options"
          "$buddy" -c "Add :provisioningProfiles dict" "$options"
          "$buddy" -c "Add :provisioningProfiles:$ZZ_BUNDLE_ID string $ZZ_PROFILE_UUID" "$options"
          "$buddy" -c "Add :uploadSymbols bool true" "$options"
          "$buddy" -c "Add :manageAppVersionAndBuildNumber bool false" "$options"
          plutil -p "$options"
          xcodebuild -exportArchive \
            -archivePath "$ZZ_ARCHIVE" \
            -exportPath "$ZZ_EXPORT" \
            -exportOptionsPlist "$options"
          ls -l "$ZZ_EXPORT"
          (cd "$ZZ_ARCHIVE" && ditto -c -k --keepParent dSYMs "$ZZ_EXPORT/zzThat-dSYMs.zip")
      - name: Verify the signature, the profile, and the version
        run: sh scripts/verify-ipa.sh "$ZZ_EXPORT/zzThat.ipa" "$ZZ_IOS_TEAM_ID" "$(tr -d '[:space:]' < apps/VERSION)" "$ZZ_BUILD_NUMBER"
      - name: Remove the keychain, the certificate, and the profile
        if: always()
        run: |
          security delete-keychain "$ZZ_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/zzthat.mobileprovision" "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" apps/ios/zzThat-release-signing.yml
          if [ -n "${ZZ_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$ZZ_PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$ZZ_PROFILE_UUID.mobileprovision"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zzthat-${{ github.run_number }}-ios-release-ipa
          path: ${{ runner.temp }}/export/zzThat.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: zzthat-${{ github.run_number }}-ios-release-dsyms
          path: ${{ runner.temp }}/export/zzThat-dSYMs.zip
          if-no-files-found: error
          retention-days: 30

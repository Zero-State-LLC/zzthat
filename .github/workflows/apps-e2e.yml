name: Apps E2E

# End-to-end run against the local zzThis Worker at the pin (runtime.md,
# End-to-end run; tasks.md T086). ZQ27 no-spend default: manual runs, and pull
# request runs only when the PR has the run-e2e label. On a pull request the
# ios job also needs the ios-ci label. No schedule. Not a merge gate and not a
# required check. A manual run can start only once this file is on main, so on
# the build PR the label is how the run happens.
#
# The test signs in with developer sign-in, creates a code titled E2E, re-rolls
# until reroll-cap, signs out, types the code, sees E2E, signs in, revokes the
# code, types it again, sees not-found, and deletes the account.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: apps-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZZ_ANDROID_E2E_TEST: com.zer0state.zzthat.e2e.EndToEndTest
  ZZ_IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  ZZ_XCODE: /Applications/Xcode_26.6.app
  ZZ_XCODEGEN_VERSION: 2.46.0
  ZZ_API: http://localhost:8787

jobs:
  android:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read the zzThis pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < contracts/ZZTHIS-API-PIN)" >> "$GITHUB_OUTPUT"
      - name: Check out zzThis at the pin
        uses: actions/checkout@v4
        with:
          repository: Zero-State-LLC/zzthis
          ref: ${{ steps.pin.outputs.sha }}
          path: zzthis
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: zzthis/package-lock.json
      - name: Start the local zzThis Worker
        working-directory: zzthis
        run: |
          npm ci
          nohup npm run dev:api -- --fresh > "$RUNNER_TEMP/dev-api.log" 2>&1 &
          for _ in $(seq 1 180); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$ZZ_API/v1" || true)"
            if [ "$code" != "000" ]; then echo "worker answered $code"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/dev-api.log"
          echo "the local Worker did not start" >&2
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End-to-end test on the local flavor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/android
          script: ./gradlew :app:connectedLocalDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=${{ env.ZZ_ANDROID_E2E_TEST }}
      - name: Upload the Worker log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-dev-api-log
          path: ${{ runner.temp }}/dev-api.log
          if-no-files-found: ignore

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'run-e2e') && contains(github.event.pull_request.labels.*.name, 'ios-ci')) }}
    runs-on: [self-hosted, macOS, ios]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read the zzThis pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < contracts/ZZTHIS-API-PIN)" >> "$GITHUB_OUTPUT"
      - name: Check out zzThis at the pin
        uses: actions/checkout@v4
        with:
          repository: Zero-State-LLC/zzthis
          ref: ${{ steps.pin.outputs.sha }}
          path: zzthis
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: zzthis/package-lock.json
      - name: Start the local zzThis Worker
        working-directory: zzthis
        run: |
          npm ci
          nohup npm run dev:api -- --fresh > "$RUNNER_TEMP/dev-api.log" 2>&1 &
          for _ in $(seq 1 180); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$ZZ_API/v1" || true)"
            if [ "$code" != "000" ]; then echo "worker answered $code"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/dev-api.log"
          echo "the local Worker did not start" >&2
          exit 1
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s "$ZZ_XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: |
          curl --proto =https -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${ZZ_XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: End-to-end UI test on the Local configuration
        run: >-
          xcodebuild test
          -project apps/ios/zzThat.xcodeproj
          -scheme zzThat
          -configuration Local
          -destination "$ZZ_IOS_DESTINATION"
          -only-testing:zzThatUITests
          -skipPackagePluginValidation
          -resultBundlePath "$RUNNER_TEMP/zzThatUITests.xcresult"
      - name: Upload the Worker log and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-results
          path: |
            ${{ runner.temp }}/dev-api.log
            ${{ runner.temp }}/zzThatUITests.xcresult
          if-no-files-found: ignore
